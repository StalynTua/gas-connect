version: '3.8'

services:
  # Base de Datos Espacial PostgreSQL 16 + Extensión PostGIS
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: gasconnect-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gasconnect_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-gasconnect_ibarra}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gasconnect_ibarra}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gasconnect-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Caché y Colas en Memoria (Redis 7)
  redis:
    image: redis:7-alpine
    container_name: gasconnect-prod-redis
    restart: always
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - gasconnect-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Servidor WebSocket Centrifugo v5 (Canales de Cabina y Monitoreo)
  centrifugo:
    image: centrifugo/centrifugo:v5
    container_name: gasconnect-prod-centrifugo
    restart: always
    volumes:
      - ./config/centrifugo.json:/centrifugo/config.json
    command: centrifugo -c config.json
    environment:
      CENTRIFUGO_ADMIN_PASSWORD: ${CENTRIFUGO_ADMIN_PASSWORD:-admin_secret_ibarra_2026}
      CENTRIFUGO_ADMIN_SECRET: ${CENTRIFUGO_ADMIN_SECRET:-centrifugo_secret_token_ibarra}
    ports:
      - "8001:8000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - gasconnect-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Motor de Ruteo Vehicular OSRM (Extracto Ecuador / Imbabura)
  osrm-ecuador:
    image: osrm/osrm-backend:latest
    container_name: gasconnect-prod-osrm
    restart: always
    volumes:
      - ./data/osrm:/data
    command: osrm-routed --algorithm mld /data/ecuador-latest.osrm
    networks:
      - gasconnect-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Gateway WhatsApp Open Source (Evolution API v2)
  evolution-api:
    image: evoapicloud/evolution-api:v2.1.2
    container_name: gasconnect-prod-evolution
    restart: always
    environment:
      SERVER_URL: ${EVOLUTION_PUBLIC_URL:-https://wa.gasconnect.ec}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-gasconnect_evolution_token_2026}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-gasconnect_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-gasconnect_ibarra}?schema=evolution
      WEBHOOK_GLOBAL_URL: http://app:8000/api/v1/whatsapp/webhook
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      EVENTS_APPLICATION_STARTUP: "false"
      EVENTS_QRCODE_UPDATED: "true"
      EVENTS_MESSAGES_UPSERT: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379
      CACHE_REDIS_PREFIX_KEY: evolution_prod
      CACHE_LOCAL_ENABLED: "false"
      CONFIG_SESSION_PHONE_CLIENT_NAME: "GasConnect"
      CONFIG_SESSION_PHONE_NAME: "Chrome"
      CONFIG_SESSION_PHONE_VERSION: "2.3000.1043857760"
      QRCODE_LIMIT: "30"
    volumes:
      - evolution_prod_instances:/evolution/instances
    ports:
      - "8080:8080"
    networks:
      - gasconnect-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Backend Fastify Monolito (API REST + Despacho + Telemetría)
  app:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: gasconnect-prod-app
    restart: always
    environment:
      NODE_ENV: production
      PORT: 8000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-gasconnect_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-gasconnect_ibarra}?schema=public
      REDIS_URL: redis://redis:6379
      CENTRIFUGO_API_URL: http://centrifugo:8000/api
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:-centrifugo_secret_token_ibarra}
      OSRM_URL: http://osrm-ecuador:5000
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-gasconnect_evolution_token_2026}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME:-gasconnect-ibarra}
      WEBHOOK_GLOBAL_URL: ${WEBHOOK_GLOBAL_URL:-http://app:8000/api/v1/whatsapp/webhook}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      centrifugo:
        condition: service_started
    networks:
      - gasconnect-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Frontend Cabina PWA (Nginx Alpine < 25 MB RAM)
  cab-pwa:
    build:
      context: .
      dockerfile: apps/cab-pwa/Dockerfile
    container_name: gasconnect-prod-cab-pwa
    restart: always
    ports:
      - "3001:80"
    networks:
      - gasconnect-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Frontend Ops Portal (Nginx Alpine < 25 MB RAM)
  ops-portal:
    build:
      context: .
      dockerfile: apps/ops-portal/Dockerfile
    container_name: gasconnect-prod-ops-portal
    restart: always
    ports:
      - "3002:80"
    networks:
      - gasconnect-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  gasconnect-net:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
  evolution_prod_instances:
