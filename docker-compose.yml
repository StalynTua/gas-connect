version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: gasconnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gasconnect_ibarra
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gasconnect_ibarra"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gasconnect-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  centrifugo:
    image: centrifugo/centrifugo:v5
    container_name: gasconnect-centrifugo
    restart: unless-stopped
    volumes:
      - ./config/centrifugo.json:/centrifugo/config.json
    command: centrifugo -c config.json
    ports:
      - "8001:8000"
    depends_on:
      redis:
        condition: service_healthy

  osrm-ecuador:
    image: osrm/osrm-backend:latest
    platform: linux/amd64
    container_name: gasconnect-osrm
    restart: unless-stopped
    ports:
      - "5001:5000"
    volumes:
      - ./data/osrm:/data
    command: osrm-routed --algorithm mld /data/ecuador-latest.osrm

  evolution-api:
    image: evoapicloud/evolution-api:v2.1.2
    container_name: gasconnect-evolution
    restart: unless-stopped
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: gasconnect_evolution_token_2026
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://postgres:postgres@postgres:5432/gasconnect_ibarra?schema=evolution
      WEBHOOK_GLOBAL_URL: http://host.docker.internal:8000/api/v1/whatsapp/webhook
      WEBHOOK_GLOBAL_ENABLED: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
      CONFIG_SESSION_PHONE_CLIENT_NAME: "GasConnect"
      CONFIG_SESSION_PHONE_NAME: "Chrome"
      CONFIG_SESSION_PHONE_VERSION: "2.3000.1043857760"
      QRCODE_LIMIT: "30"
      EVENTS_QRCODE_UPDATED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - evolution_instances:/evolution/instances
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
  evolution_instances:
